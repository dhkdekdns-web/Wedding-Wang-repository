<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비밀의 방 - 2단계</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #fcfcfc;
            font-family: 'Noto Serif KR', serif;
            padding: 20px;
            box-sizing: border-box;
        }

        h2 {
            color: #5d5c5c;
            margin-bottom: 20px;
            font-size: 1.4rem;
            text-align: center;
            word-break: keep-all;
        }

        /* 팝업(모달) 전체 배경 스타일 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000; /* 팝업이 가장 위에 보이도록 설정 */
        }

        /* 팝업(모달) 내부 컨텐츠 박스 */
        .modal-content {
            background-color: #fff;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        /* 팝업 이미지 */
        .modal-content img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            margin-bottom: 20px;
            display: block;
        }

        /* 팝업 버튼 컨테이너 */
        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        /* 팝업 버튼 공통 스타일 */
        .modal-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Noto Serif KR', serif;
            font-size: 1rem;
            font-weight: 600;
            transition: background-color 0.2s;
        }

        /* 돌아가기 버튼 */
        .btn-back {
            background-color: #e0e0e0;
            color: #333;
        }

        .btn-back:hover {
            background-color: #ccc;
        }

        /* 미니게임 도전하기 버튼 */
        .btn-start {
            background-color: #ff9f43;
            color: #fff;
        }

        .btn-start:hover {
            background-color: #ff8c21;
        }

        /* 사진과 투명 버튼을 감싸는 박스 */
        .image-container {
            position: relative;
            width: 100%;
            max-width: 500px; /* 사진 최대 크기 제한 */
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        /* 배경 사진 */
        .image-container img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* 투명 버튼 공통 스타일 */
        .hidden-btn {
            position: absolute;
            cursor: pointer;
            /* 💡 위치 맞출 때 아래 주석(/* ... */)을 지우면 버튼 영역이 빨갛게 보여서 맞추기 쉽습니다! */
            /* background-color: rgba(255, 0, 0, 0.4); border: 2px solid red; */
        }

        /* 특정위치 1 (120억 메소 함정) */
        .trap-area {
            top: 51%;     /* 위에서부터 몇 % 내려올지 */
            left: 52%;    /* 왼쪽에서부터 몇 % 떨어질지 */
            width: 8%;   /* 버튼의 가로 크기 */
            height: 3%;  /* 버튼의 세로 크기 */
        }

        /* 특정위치 2 (정답, 3페이지로 이동) */
        .success-area {
            top: 51%;
            left: 39%;
            width: 8%;
            height: 3%;
        }
    </style>
</head>
<body>

    <div id="introModal" class="modal-overlay">
        <div class="modal-content">
            <img src="./images/easter_intro.png" alt="인트로 이미지">
            <div class="modal-buttons">
                <button class="modal-btn btn-back" onclick="goBack()">돌아가기</button>
                <button class="modal-btn btn-start" onclick="closeModal()">미니게임 도전하기</button>
            </div>
        </div>
    </div>
    <h2>보스를 돌기 전 드랍을 챙겨가야해요!</h2>

    <div class="image-container">
        <img src="./images/간배키.png" alt="드랍 아이템 챙기기">
        
        <div class="hidden-btn trap-area" onclick="hitTrap()"></div>
        
        <div class="hidden-btn success-area" onclick="goPage3()"></div>
    </div>

    <script>
        // 팝업: 돌아가기 클릭 시 easter.html로 이동
        function goBack() {
            window.location.href = "easter.html";
        }

        // 팝업: 미니게임 도전하기 클릭 시 팝업 닫기(숨김 처리)
        function closeModal() {
            document.getElementById('introModal').style.display = 'none';
        }

        // 1번 위치 클릭 시: 함정 발동
        function hitTrap() {
            alert("저런! 당신은 지금 120억 메소를 날렸어요!");
        }

        // 2번 위치 클릭 시: 다음 페이지로 이동
        function goPage3() {
            window.location.href = "easter_3.html";
        }
    </script>

</body>
</html>
